display_information:
  name: Ticky
  description: Mini Slack task manager for channels and DMs
  background_color: "#0f172a"
features:
  bot_user:
    display_name: Ticky
    always_online: false
  shortcuts:
    - name: Add message to Ticky
      type: message
      callback_id: todo_add_message_as_task
      description: Turn this message into a task
  slash_commands:
    - command: /todo
      description: Manage shared todos
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - users:read
settings:
  interactivity:
    is_enabled: true
    request_url: https://example.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
